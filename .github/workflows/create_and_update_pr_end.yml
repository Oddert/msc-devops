name: Create PR Env

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [reopened, opened, synchronize, edited]

jobs:
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: front

      - name: Run frontend tests
        run: npm test
        working-directory: front

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: back/requirements.txt

      - name: Install Dependencies
        run: pip install -r requirements.txt
        working-directory: back

      - name: Run backend tests
        run: pytest test_api.py -v
        working-directory: back

  create_or_update_pr_env:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BRANCH_NAME: ${{ github.head_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: front

      - name: Build Site
        run: npm run build
        working-directory: front

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -backend-config="key=${{ env.BRANCH_NAME }}.do-demo.com.tfstate" -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -var="is_temp_env=true" -var="env_prefix=${{ env.BRANCH_NAME }}." -out tf.plan

      - name: Terraform Apply
        run: terraform apply tf.plan

      - name: Terraform Output
        id: terraform
        run: echo "website=$(terraform output -raw website)" >> $GITHUB_OUTPUT

      - name: Sync to S3
        run: aws s3 sync front/dist s3://${{ env.BRANCH_NAME }}.do-demo.com

      - name: Add PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const website = process.env.WEBSITE_LINK;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Build complete, review a [preview of the site here](${website})`
            })
        env:
          WEBSITE_LINK: ${{ steps.terraform.outputs.website }}
